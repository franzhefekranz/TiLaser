name: Screenshots

# Erzeugt die Screenshots der Bedienungsanleitung (docs/screenshots) mit der echten
# Oberfläche ohne Bildschirm (Qt offscreen). Auf main werden sie automatisch eingecheckt,
# bei Pull Requests als Artefakt zum Ansehen bereitgestellt.
on:
  push:
    branches: [main]
    paths: ["tilaser/**", "tools/**", "beispiele/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["tilaser/**", "tools/**", "beispiele/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systembibliotheken und Schriften
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-liberation
      - name: Python-Pakete
        run: python -m pip install -r requirements.txt
      - name: Screenshots erzeugen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_screenshots.py docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
      - name: Einchecken (nur main)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Screenshots."
          else
            git commit -m "Screenshots aktualisiert [skip ci]"
            git push
          fi
