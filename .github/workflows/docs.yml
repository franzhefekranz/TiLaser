name: Dokumentation

# 1. Screenshots der Bedienungsanleitung mit der echten Oberfläche ohne Bildschirm (Qt offscreen)
# 2. PDF der Bedienungsanleitung (pandoc + XeLaTeX)
# 3. GitHub-Wiki aus der Bedienungsanleitung
# 4. Projektseite https://franzhefekranz.github.io/TiLaser/ (GitHub Pages)
# Auf main werden Screenshots und PDF eingecheckt und das Wiki aktualisiert,
# bei Pull Requests gibt es alles als Artefakt zum Ansehen.
on:
  push:
    branches: [main]
    paths: ["tilaser/**", "tools/**", "beispiele/**", "site/**", "docs/Bedienungsanleitung.md",
            "docs/Manual_en.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["tilaser/**", "tools/**", "beispiele/**", "site/**", "docs/Bedienungsanleitung.md",
            "docs/Manual_en.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systembibliotheken und Schriften
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-dejavu-extra \
            fonts-liberation pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-german lmodern
      - name: Python-Pakete
        run: python -m pip install -r requirements.txt
      - name: Screenshots erzeugen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_screenshots.py docs/screenshots
      - name: Screenshots (englische Oberfläche)
        env:
          QT_QPA_PLATFORM: offscreen
          TILASER_LANG: en
        run: python tools/make_screenshots.py docs/screenshots/en
      - name: PDF erzeugen
        run: python tools/make_pdf.py docs/TiLaser-Bedienungsanleitung.pdf
      - name: PDF erzeugen (englisch)
        run: python tools/make_pdf.py docs/TiLaser-Manual.pdf en
      - name: Wiki-Seiten erzeugen
        run: python tools/make_wiki.py build/wiki
      - name: Projektseite erzeugen
        run: python tools/make_site.py build/site
      - uses: actions/upload-artifact@v4
        with:
          name: dokumentation
          path: |
            docs/screenshots/*.png
            docs/screenshots/en/*.png
            docs/TiLaser-Bedienungsanleitung.pdf
            docs/TiLaser-Manual.pdf
            build/wiki
            build/site
      - name: Projektseite für GitHub Pages bereitstellen (nur main)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Screenshots und PDF einchecken (nur main)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/TiLaser-Bedienungsanleitung.pdf docs/TiLaser-Manual.pdf
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Dokumentation aktualisiert (Screenshots, PDF) [skip ci]"
            git push
          fi
      - name: Wiki veröffentlichen (nur main)
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          python tools/make_wiki.py wiki
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki unverändert."
          else
            git commit -m "Wiki aus docs/Bedienungsanleitung.md aktualisiert"
            git push
          fi

  pages:
    name: Projektseite veröffentlichen
    needs: screenshots
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
