name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (EXE, Installer, portabel)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Bauen
        shell: pwsh
        run: pwsh -NoProfile -File packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TiLaser-windows
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (AppImage, deb)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ältere Basis = ältere glibc = läuft auf mehr Distributionen.
          # PyQt6-Wheels: x86_64 braucht glibc >= 2.35, aarch64 glibc >= 2.39 (daher 24.04).
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-util1 libxkbcommon-x11-0 libegl1 libgl1 \
            fonts-dejavu-core desktop-file-utils
      - name: Version prüfen (bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c 'import tilaser; print(tilaser.__version__)')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu __version__ $V"; exit 1; }
      - name: Bauen
        run: PYTHON=python bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TiLaser-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            docs/TiLaser-Bedienungsanleitung.pdf
          generate_release_notes: true
